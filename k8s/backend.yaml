apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hotel-backend:cie
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: databaseUrl
              value: jdbc:mysql://mysql-service:3306/hotelmanagement

            - name: databaseUsername
              value: root

            - name: databasePassword
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: jwtsecretKey
              value: "docker-test-secret-key-123456789"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP